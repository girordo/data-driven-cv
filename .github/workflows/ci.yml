name: CI for CV
on:
  push:
    paths:
      - .github/workflows/ci.yml
      - 'data/**'
      - 'templates/**'
      - 'build.py'
    branches:
      - main
      - dev
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Creation of resume in en and pt-br (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -q -r requirements.txt

      - name: Cache TinyTeX
        uses: actions/cache@v4
        id: cache-tinytex
        with:
          path: |
            ~/.TinyTeX
            ~/.local/bin/xelatex
            ~/.local/bin/tlmgr
          key: ${{ runner.os }}-tinytex-moderncv-v1

      - name: Install TinyTeX and LaTeX packages
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://yihui.org/tinytex/install-bin-unix.sh" | sh
          $HOME/.TinyTeX/bin/x86_64-linux/tlmgr install moderncv fontawesome6 fontawesome5 koma-script dejavu-otf collection-fontsrecommended pgf mathpazo dejavu

      - name: Add TinyTeX to PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> $GITHUB_PATH

      - name: Render Resumes and Cover Letters
        run: |
          python3 build.py

      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add resumes/*.pdf cover-letter/*.pdf
          if git diff --staged --quiet; then
            echo "No changes in PDFs to commit."
          else
            git commit -m "chore: update compiled CVs and cover letters [skip ci]"
            git push
          fi